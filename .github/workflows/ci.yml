name: CI

# Unit + UI tests run on the developer's Mac via ios/scripts/ci-local.sh, which posts the required
# `local-tests` commit status (REQUIREMENTS.md §7.22). GitHub only runs the cheap lint job automatically;
# the macOS test job remains as a manual fallback: gh workflow run CI --ref <branch> -f macos_tests=true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_tests:
        description: Also run unit + UI tests on a GitHub macOS runner
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: swiftlint --strict --reporter github-actions-logging

  macos-tests:
    name: Unit + UI tests (GitHub macOS, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.macos_tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write build secrets
        env:
          BNXT_API_KEY: ${{ secrets.BNXT_API_KEY }}
        run: |
          # Optional: without the secret the app builds with no API key (REQUIREMENTS §7.15).
          if [ -n "$BNXT_API_KEY" ]; then
            printf 'BNXT_API_KEY = %s\n' "$BNXT_API_KEY" > ios/Config/Secrets.xcconfig
          fi
      - name: Generate project
        run: cd ios && xcodegen generate
      - name: Pick an iPhone simulator on iOS 26+
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devs = json.load(sys.stdin)['devices']
          ok = []
          for runtime, items in devs.items():
              m = re.search(r'iOS-(\d+)-(\d+)', runtime)
              if not m or int(m.group(1)) < 26:
                  continue
              ok += [((int(m.group(1)), int(m.group(2))), d['name'], d['udid'])
                     for d in items if d['name'].startswith('iPhone')]
          if not ok:
              sys.exit('No iPhone simulator on iOS 26+')
          print(max(ok, key=lambda x: (x[0], x[1]))[2])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test (same command as ios/SETUP.md)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project BNXT.xcodeproj -scheme BNXT \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:BNXTUITests/AppStoreScreenshotUITests \
            -collect-test-diagnostics never \
            -resultBundlePath ../TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
