name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --strict --reporter github-actions-logging

  test:
    name: Unit + UI tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen generate
      - name: Pick an iPhone simulator on iOS 26+
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devs = json.load(sys.stdin)['devices']
          ok = [(k, d) for k, v in devs.items() for d in v
                if 'iOS' in k and d['name'].startswith('iPhone')
                and int(re.search(r'iOS-(\d+)', k).group(1)) >= 26]
          print(sorted(ok)[-1][1]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test (same command as ios/SETUP.md)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project BNXT.xcodeproj -scheme BNXT \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:BNXTUITests/AppStoreScreenshotUITests \
            -collect-test-diagnostics never \
            -resultBundlePath ../TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
